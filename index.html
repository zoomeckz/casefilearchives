        <h2 style="color:#fbbf24;">About the Story</h2>
        <p>Sedorium is an original dark fantasy web novel set in a world of five nations, ancient druids, and mystical creatures. Drawing from real life experiences, anime, music, and other mediums, author Sam Nowroozi Larki crafts a vivid world where power is earned through combat, kingdoms rise and fall, and the line between hero and demon blurs with every chapter.</p>

        <h2 style="color:#fbbf24;">Characters</h2>
        <dl>
          <dt style="color:#38bdf8;font-weight:bold;">Sam</dt>
          <dd>A mysterious man with no memory of his past. Has dark brown, wildly untamed hair, heterochromia (one dark brown eye, one bright grey), stands about 180cm tall. Wears black baggy clothes. Can communicate with Treants and has a tamed Myothane named Fendo. His body absorbs and redirects impact through "reverberation."</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Mira — The Pink Drake</dt>
          <dd>Current Empress of Beambreak, mother to Ayel and Rathel. A woman of great height with gleaming yellow eyes and white-blond hair. Her druid form is a massive fire drake with pink scales.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Ayel — The Treasure of Beambreak</dt>
          <dd>Firstborn daughter of Mira and Rashad. Has shining yellow eyes that change color with her emotions and glow in darkness. Possesses an incomplete druid form—can only partially transform body parts.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Rathel — The Soundless</dt>
          <dd>Son of Mira and Rashad. Has dark brown untamed hair and walks with completely silent steps. His druid forms are a black panther and a bear, which he blends into a werewolf-like hybrid.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Rashad — The Former Cat King</dt>
          <dd>Husband to Mira. A pale-skinned man with hazel eyes and unkempt light brown hair. Known for walking among the common people and his infectious booming laugh. Died mysteriously.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Felm</dt>
          <dd>A mysterious figure with piercing ocean-blue eyes who leads a secretive group with knowledge of ancient gifts.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Vicera</dt>
          <dd>A spectral woman with pale porcelain skin, piercing green eyes, and fiery red hair. Possesses mystical abilities to detect "the gift" in others.</dd>
        </dl>

        <h2 style="color:#fbbf24;">World &amp; Lore</h2>
        <dl>
          <dt style="color:#d97706;font-weight:bold;">Beambreak</dt>
          <dd>The crown jewel city at the center of the five nations. Divided into concentric rings: Aromi, Igneous, Meta, and Sedi. Every 4 years, challengers can fight the ruler for the throne.</dd>

          <dt style="color:#d97706;font-weight:bold;">Feldus</dt>
          <dd>Western nation covered in vast, dense forests. Home to the Elves (Feldurians), known for sharpshooting and foresight.</dd>

          <dt style="color:#d97706;font-weight:bold;">Dim'cra</dt>
          <dd>Northern nation, the largest but least inhabitable due to hellish sun. People live in mountain paradises.</dd>

          <dt style="color:#d97706;font-weight:bold;">Helsim</dt>
          <dd>Eastern nation of water with almost no land. Floating and submerged cities that move with currents.</dd>

          <dt style="color:#d97706;font-weight:bold;">Mezaru</dt>
          <dd>Southern nation dwelling underground in complex tunnel cities. The world's most talented craftsmen.</dd>

          <dt style="color:#d97706;font-weight:bold;">Sedorium</dt>
          <dd>The most prized reagent—a rainbow-colored stone that glows when touched. Burns for weeks when ignited. Used for heating, lighting, smelting, and weapons.</dd>

          <dt style="color:#d97706;font-weight:bold;">Druid</dt>
          <dd>Rare beings who can transform into animal forms. Each druid is born with at least one form to master. The royal family of Beambreak are all druids.</dd>

          <dt style="color:#d97706;font-weight:bold;">Velune</dt>
          <dd>A dangerous creature skilled in hand-to-hand combat. Some harness Sedorium to create powerful illusions.</dd>

          <dt style="color:#d97706;font-weight:bold;">Myothane</dt>
          <dd>Nature's most mystically skilled hunter on land. Always hunt in tight packs. Considered impossible to tame.</dd>

          <dt style="color:#d97706;font-weight:bold;">Treant</dt>
          <dd>Ancient living trees that can speak and move. Their root networks stretch across vast distances as a communication system.</dd>
        </dl>
