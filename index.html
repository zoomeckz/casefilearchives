        <h2 style="color:#fbbf24;">About the Story</h2>
        <p>Sedorium is an original dark fantasy web novel set in a world of five nations, ancient druids, oathbreakers, and mystical creatures. A mysterious man named Sam appears with no memory of his past — only heterochromatic eyes, an impossible ability to communicate with Treants, and a tamed Myothane named Fendo. As the druid royal family of Beambreak unravels a lineage of broken oaths stretching back thousands of years, the secrets of the mountain city once called Lamoon threaten to reshape the continent.</p>

        <h2 style="color:#fbbf24;">Characters</h2>
        <dl>
          <dt style="color:#38bdf8;font-weight:bold;">Sam</dt>
          <dd>A mysterious man with no memory of his past. Has dark brown, wildly untamed hair, heterochromia (one dark brown eye, one bright grey), stands about 180cm tall. Wears black baggy clothes. Can communicate with Treants and has a tamed Myothane named Fendo. His body absorbs and redirects impact through "reverberation."</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Mira — The Pink Drake</dt>
          <dd>Current Empress of Beambreak, mother to Ayel and Rathel. A woman of great height with gleaming yellow eyes and white-blond hair. Her druid form is a massive fire drake with pink scales.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Ayel — The Treasure of Beambreak</dt>
          <dd>Firstborn daughter of Mira and Rashad. Has shining yellow eyes that change color with her emotions. Possesses an incomplete druid form — can only partially transform body parts, a consequence of the Oathbreaker bloodline.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Rathel — The Soundless</dt>
          <dd>Son of Mira and Rashad. Has dark brown untamed hair and walks with completely silent steps. His druid forms are a black panther and a bear, which he blends into a werewolf-like hybrid.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Rashad — The Former Cat King</dt>
          <dd>Husband to Mira. Known for walking among common people and his infectious booming laugh. Died mysteriously.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Felm — The Keeper</dt>
          <dd>A mysterious figure with piercing ocean-blue eyes, dark windswept hair, and scarred rune-marked hands. Leads a secretive group with knowledge of ancient gifts. Present at Sam's birth.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Vicera</dt>
          <dd>A spectral woman with pale porcelain skin, piercing green eyes, and fiery red hair. Possesses mystical abilities to detect "the gift" in others — her eyes blaze with opal brilliance during the ritual.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Maelle</dt>
          <dd>Sam and Ayel's ancestor. Born into the purest druidic bloodline, she broke the ancient covenant by falling in love with Ignius, a bastard druid. The original Oathbreaker.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Ignius</dt>
          <dd>A bastard druid with two catastrophically conflicting forms — raw unstructured fire and an uncontainable lycan. The most dangerous living thing on the continent. Lover of Maelle.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Beam</dt>
          <dd>Son of Maelle and Ignius. The highest class of demon that ravaged the continent. The battle that killed him on Mount Ahl gave the city its name: Beambreak.</dd>

          <dt style="color:#38bdf8;font-weight:bold;">Bertrand — The Throne Archivist</dt>
          <dd>A tall, angular man with mismatched eyes. His bloodline has maintained perfect eidetic recall for nineteen generations. Keeper of the Veylan Fragments.</dd>
        </dl>

        <h2 style="color:#fbbf24;">World &amp; Lore</h2>
        <dl>
          <dt style="color:#d97706;font-weight:bold;">Beambreak (formerly Lamoon)</dt>
          <dd>The capital city of the Mamori nation, built on Mount Ahl. Once called Lamoon, it was the seat of the fifth throne and sits on the largest natural deposit of Sedorium ever discovered. The city was renamed after the battle that killed the demon Beam.</dd>

          <dt style="color:#d97706;font-weight:bold;">The Five Nations</dt>
          <dd>Mamori (central), Feldus (west, elven forests), Dim'cra (north, mountain paradises under hellish sun), Helsim (east, floating water cities), and Mezaru (south, underground tunnel cities).</dd>

          <dt style="color:#d97706;font-weight:bold;">Sedorium</dt>
          <dd>The most prized reagent — a rainbow-colored stone that glows when touched. Burns for weeks when ignited. Used for heating, lighting, smelting, and weapons. The resource that held civilization together and tore it apart.</dd>

          <dt style="color:#d97706;font-weight:bold;">Oathbreaker</dt>
          <dd>The first royal druidic bloodline to break the ancient covenant by mixing their bloodline outside the five thrones. Maelle and Ignius were the originals; their descendants carry the weight of the broken oath.</dd>

          <dt style="color:#d97706;font-weight:bold;">Druid</dt>
          <dd>Rare beings who can transform into animal forms. The five thrones maintained druidic purity through internal pairing. Breaking this covenant produced catastrophic results — incomplete forms, competing transformations, or cellular collapse.</dd>

          <dt style="color:#d97706;font-weight:bold;">Myothane</dt>
          <dd>Nature's most mystically skilled hunter on land. Always hunt in tight packs. Considered impossible to tame — yet Sam has one named Fendo.</dd>

          <dt style="color:#d97706;font-weight:bold;">Treant</dt>
          <dd>Ancient living trees that can speak and move. Their root networks stretch across vast distances as a communication system. Sam can communicate with them.</dd>

          <dt style="color:#d97706;font-weight:bold;">Velune</dt>
          <dd>A dangerous creature skilled in hand-to-hand combat. Some harness Sedorium to create powerful illusions.</dd>

          <dt style="color:#d97706;font-weight:bold;">Lycan</dt>
          <dd>A wolf-like druid beast form of extraordinary and uncontainable power. When manifested, it consumes the druid's consciousness entirely.</dd>

          <dt style="color:#d97706;font-weight:bold;">Veylan Fragments</dt>
          <dd>Ancient texts containing descriptions of "void signatures" and convergence patterns. Referenced by the Throne Archivist Bertrand.</dd>
        </dl>
