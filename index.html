        <h2 style="color:#fbbf24;">About the Story</h2>
        <p>Sedorium is an original dark fantasy web novel set in a world of five nations — Mamori, Feldus, Mezaru, Helsim, and Dim'Cra. A mysterious stranger named Sam appears with no memory of his past, bearing heterochromatic eyes and an impossible ability to speak with Treants. The royal family of Beambreak — Queen Mira, Princess Ayel, and Prince Rathel — guard ancient secrets tied to the Oathbreaker bloodline, druid transformations, the Kaelith dynasty, and a mineral called Sedorium that powers civilization itself. From the Shaper District to Kaizoku, from the Ra'den people to Lord Errol's bacchanals, and into the encampments of the Hjord with herbalist Lyra, the world expands with every chapter.</p>
